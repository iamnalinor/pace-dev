# Git hooks (installed by `bun install` via the `prepare` script).
# Lint before each commit. No pre-push hook (owner, 2026-11-02): it tested the working tree, not
# the commits being pushed, and blocked pushes while other work was in progress; CI runs the
# tests on the pushed commits.
pre-commit:
  jobs:
    - name: lint
      run: bun lint
      # `bun lint` auto-fixes (formatting, sortable imports): stage those fixes.
      stage_fixed: true
