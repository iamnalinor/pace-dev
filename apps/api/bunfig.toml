[test]
# Enforced by `bun run test:coverage` (unit + integration; CI job "api-tests").
# Bun applies thresholds PER FILE. Only lines are enforced: function coverage is
# noisy for declarative files (Drizzle table callbacks, relations). An omitted key
# defaults to 0.9, hence the explicit `functions = 0`.
coverageThreshold = { lines = 0.9, functions = 0 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["tests/**", "**/*.fake.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
