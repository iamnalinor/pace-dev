<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Pace — a personal task and time tracker" />
    <meta name="color-scheme" content="dark light" />
    <!-- <generated:document> -->
    <meta name="theme-color" content="#0d0f15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <style id="pace-ground">
      :root {
        --pace-page: #0d0f15;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --pace-page: #f4f5f9;
          color-scheme: light;
        }
      }
      :root[data-theme="dark"] {
        --pace-page: #0d0f15;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --pace-page: #f4f5f9;
        color-scheme: light;
      }
      html,
      body {
        background-color: var(--pace-page);
      }
    </style>
    <!-- </generated:document> -->
    <script src="/theme-boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://telegram.org" />
    <link rel="preconnect" href="https://oauth.telegram.org" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pace</title>
    <!-- react-native-web's root reset: the app fills the window and scrolls inside its views. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Pace needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
