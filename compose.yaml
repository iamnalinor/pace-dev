# Production-like stack:  docker compose up --build   →  http://localhost:8080
# Local development only needs the database:  docker compose up -d db
name: template

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: template
    ports:
      - "127.0.0.1:5432:5432" # for `bun dev` and tests on the host; not exposed publicly
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/template
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (see .env.example)}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      NODE_ENV: production
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
