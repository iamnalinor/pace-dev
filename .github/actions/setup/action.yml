name: Setup
description: Install Bun (version from .bun-version) and dependencies, with a cache.

# Caches are written by main only: pull requests restore main's (GitHub shares a base branch's
# caches with PRs) and never upload their own, so storage holds one copy and PR runs skip the
# upload time.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - uses: actions/cache/restore@v6
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
