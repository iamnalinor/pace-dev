name: CI

# Minutes are rationed (private repo): one run per change, nothing for docs-only changes,
# two jobs instead of six (every job pays its own checkout + install and is billed rounded
# up to the minute), e2e only once the fast checks pass, and the Gradle build on demand.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "context/**", "LICENSE"]
  push:
    # Branches are checked through their pull request; main runs once more for the deploy.
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "context/**", "LICENSE"]
  workflow_dispatch:

# Least privilege by default; jobs ask for more only when needed.
permissions:
  contents: read

# A newer push to the same branch makes the running check moot; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The Expo CLI and jest run under Node through their shebang when invoked via `bun run`
# (never `bun --bun`); Playwright starts its servers itself (playwright.config.ts).
env:
  CI: 1
  # Typed ESLint over seven tsconfig projects outgrew Node's default heap on the runners.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  checks:
    name: Checks (lint, audit, unit, app, API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun lint
      - name: Lint must not change files (run `bun lint` locally and commit)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi
      # Two advisories have no patched release yet and sit in dev-only tooling (metro/jest/
      # tailwind 3 → micromatch → braces; @expo/cli → node-forge); nothing of them ships to
      # the Worker or the app bundle. Drop the ignores once upstream publishes fixes.
      # GHSA-mrhx-c7xc-m3w5 (zod): the workspaces run the fixed 4.6.6; only @expo/cli (zod 3)
      # and @cloudflare/vitest-plugin (4.4.3, pinned) keep old copies, at build and test time.
      # GHSA-qr28-fpjm-wq7f (decode-uri-component): expo-router's query-string 7 requires it
      # from CommonJS and the fix (0.5.1) is ESM-only; the worst case is a slow tab on a crafted
      # link to the person's own app. Drop both once expo-router and the plugin move on.
      - run: >-
          bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-mrhx-c7xc-m3w5 --ignore GHSA-qr28-fpjm-wq7f
      - run: bun test:unit
      # Jest's Babel transforms of React Native and Expo are the slow part of the app tests;
      # they are content-hashed, so the newest main cache is always safe to start from.
      - uses: actions/cache/restore@v6
        with:
          path: .cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            jest-${{ runner.os }}-
      - run: bun test:app
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
      - run: bun test:api
      - run: bun test:updates
      # The Firebase controller is Android-free: pin its crash/restart decisions without
      # installing an SDK or starting an emulator. Android build/device gates stay separate.
      # It downloads a Kotlin compiler and two jars and cold-compiles, so a pull request runs it
      # only when the controller or the script changed; main (and a manual run) always does.
      - name: Did the native Firebase controller change?
        id: native
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -qE '^(apps/app/modules/pace-native/|scripts/native/test-firebase\.sh$)' <<<"$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The downloads are pinned by digest in the script, so its hash is the whole cache key.
      - if: github.event_name != 'pull_request' || steps.native.outputs.changed == 'true'
        uses: actions/cache/restore@v6
        id: native-jvm
        with:
          path: .cache/native-jvm
          key: native-jvm-${{ runner.os }}-${{ hashFiles('scripts/native/test-firebase.sh') }}
      - if: github.event_name != 'pull_request' || steps.native.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Native Firebase controller (JVM only)
        if: github.event_name != 'pull_request' || steps.native.outputs.changed == 'true'
        run: bun run test:native-firebase
      - if: github.ref == 'refs/heads/main' && steps.native-jvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/native-jvm
          key: native-jvm-${{ runner.os }}-${{ hashFiles('scripts/native/test-firebase.sh') }}

  e2e:
    name: End-to-end (Playwright)
    # Only worth its minutes once the fast checks pass.
    needs: checks
    runs-on: ubuntu-latest
    # The chromium project ran ~20 min on a runner once the overhaul's suites landed (217 tests),
    # and the latency step runs after it on fresh servers; 20 and then 35 cut the run off mid-chromium.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The browser download is cached (written by main only); its system libraries are not.
      - uses: actions/cache/restore@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The tap-latency budget measures the CPU, and its ceilings were measured with the project run
      # alone on fresh servers (e2e/latency.e2e.ts): so CI runs it the same way, as a step of its
      # own after the rest, against a freshly started Worker (fresh state) and web server (the same
      # build, not rebuilt). A latency run right after ~200 tests on the same servers read 296 ms
      # against a 240 ms ceiling (bug-lessons log, A9 fix round 3); the ceilings stay Task 5.6's.
      - run: bunx playwright test --project chromium
      - name: Checkpoint history and export (opt-in test server)
        run: bunx playwright test e2e/checkpoint-history.e2e.ts --project chromium --workers 1
        env:
          E2E_REUSE_WEB_BUILD: 1
          PACE_E2E_CHECKPOINTS: 1
      - run: bunx playwright test --project latency --no-deps
        env:
          E2E_REUSE_WEB_BUILD: 1
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  android-apk:
    name: Android release APK (arm64)
    # Gradle is the costliest job by far: on demand only. It builds what release.yml ships (R8,
    # the bundled JS) without publishing it; a debug APK would need a Metro server to start.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_GIT_STATUS: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags and history: a build between releases is versioned on the last tag.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK + CMake (the runner image already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Expo prebuild (continuous native generation, android/ is gitignored)
        working-directory: apps/app
        run: bun expo prebuild --platform android --no-install
      - name: Assemble release APK (signed with the committed debug keystore)
        working-directory: apps/app/android
        run: >-
          ./gradlew :app:assembleRelease --no-daemon
          '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+ExitOnOutOfMemoryError'
          -PreactNativeArchitectures=arm64-v8a
      - name: APK size
        run: du -h apps/app/android/app/build/outputs/apk/release/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pace-release-apk
          path: apps/app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
