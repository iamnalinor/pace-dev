name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs ask for more only when needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (format, eslint, types, knip, jscpd, architecture, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun lint
      - name: Lint must not change files (run `bun lint` locally and commit)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

  web-unit:
    name: Web component tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/web test:unit

  api-tests:
    name: API unit + integration tests (Testcontainers) with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/api test:coverage

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/template_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
      - run: bun test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      # The E2E suite signs up many users from one IP within seconds.
      AUTH_RATE_LIMIT: "false"
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test through nginx (web → api → db)
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:8080/api/health/ready | grep -q '"ready"'
          # API docs must be disabled in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/docs)" = "404"
      # The same user journeys in a real browser, through nginx (CSP, headers, proxy).
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
      - run: bun test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # braces (dev-only, via eslint-plugin-check-file > micromatch) has no patched release yet.
      - run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
