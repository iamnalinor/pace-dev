name: Mutation testing

# Slow by nature: weekly and on demand, not on every push.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker (core + web)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-reports
          path: |
            packages/core/reports/
            apps/web/reports/
          if-no-files-found: warn
          retention-days: 30
