name: Android E2E

# KVM minutes are spent only on demand: dispatch, reusable call, or the android-e2e PR label.
# Reapply the label to test a newer PR commit. Release integration awaits proven smoke evidence.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  workflow_call:
    inputs:
      run_smoke:
        description: "Run the smoke when called from another workflow, including a PR caller"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'android-e2e' || inputs.run_smoke == true }}
    concurrency:
      group: android-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    name: Android emulator smoke (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.run_smoke == true && github.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install the Android build SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" < <(yes)
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-android-e2e-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build the test release APK
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
          EXPO_PUBLIC_DEV_LOGIN: "1"
        run: bash scripts/android/smoke.sh build
      - name: Install Maestro 2.11.0
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          release=https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0
          curl --fail --silent --show-error --location --retry 3 "$release/maestro.zip" -o maestro.zip
          # SHA-256 from this release's checksums_sha256.txt.
          printf '%s  maestro.zip\n' 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a | sha256sum --check -
          unzip -q maestro.zip
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Boot API 34 and run the smoke flow
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-build: 15261927 # Android Emulator 36.5.11 stable
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash scripts/android/smoke.sh run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke
          path: .cache/android-e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
