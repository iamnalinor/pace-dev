name: Deploy

# Runs after the "CI" workflow succeeds on main (workflow_run), or by hand.
# workflow_run was chosen over `needs:` + reusable workflows because it keeps ci.yml a plain
# workflow (PR checks stay unchanged) and never deploys a commit whose CI failed. The trade-off:
# in a workflow_run event `github.sha`/`github.ref` point at the default branch head, so the
# checkout below pins the exact commit CI tested (`workflow_run.head_sha`).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not interleave (migrations, secrets, webhook): one at a time, never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CI: 1
  API_URL: https://pace-api.nalinor.dev
  # wrangler reads these from the environment, no wrangler-action needed.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Cloudflare (API worker, D1 migrations, web assets, Telegram webhook)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pace.nalinor.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup

      - name: Build web
        working-directory: apps/web
        env:
          VITE_API_URL: https://pace-api.nalinor.dev
          VITE_TELEGRAM_BOT: ${{ vars.TELEGRAM_BOT_USERNAME || 'PaceTaskTrackerBot' }}
        run: bun run build

      - name: Apply D1 migrations
        working-directory: apps/api
        run: bunx wrangler d1 migrations apply pace --remote

      - name: Deploy API worker
        working-directory: apps/api
        run: bunx wrangler deploy

      - name: Deploy web (static assets worker)
        working-directory: apps/web
        run: bunx wrangler deploy

      # Worker secrets are pushed only when the GitHub secret is set, so a fork or a fresh
      # deployment without a bot token still deploys (login stays disabled until it is added).
      - name: Secret TELEGRAM_BOT_TOKEN
        working-directory: apps/api
        env:
          VALUE: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: if [ -n "$VALUE" ]; then echo "$VALUE" | bunx wrangler secret put TELEGRAM_BOT_TOKEN; fi

      - name: Secret TELEGRAM_WEBHOOK_SECRET
        working-directory: apps/api
        env:
          VALUE: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: if [ -n "$VALUE" ]; then echo "$VALUE" | bunx wrangler secret put TELEGRAM_WEBHOOK_SECRET; fi

      - name: Secret GROQ_API_KEY
        working-directory: apps/api
        env:
          VALUE: ${{ secrets.GROQ_API_KEY }}
        run: if [ -n "$VALUE" ]; then echo "$VALUE" | bunx wrangler secret put GROQ_API_KEY; fi

      - name: Secret GEMINI_API_KEY
        working-directory: apps/api
        env:
          VALUE: ${{ secrets.GEMINI_API_KEY }}
        run: if [ -n "$VALUE" ]; then echo "$VALUE" | bunx wrangler secret put GEMINI_API_KEY; fi

      # BOT_INFO is the JSON of getMe, stored at deploy time so the bot never calls Telegram
      # on a cold start. Stored as a secret (same mechanism, not committed to wrangler.jsonc).
      - name: Store BOT_INFO (getMe)
        working-directory: apps/api
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN not set, skipping getMe"; exit 0; fi
          BOT_INFO="$(curl --fail --silent --show-error "https://api.telegram.org/bot${TOKEN}/getMe" | jq -c '.result')"
          test -n "$BOT_INFO"
          echo "$BOT_INFO" | bunx wrangler secret put BOT_INFO

      - name: Set Telegram webhook
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN not set, skipping setWebhook"; exit 0; fi
          curl --fail --silent --show-error --request POST "https://api.telegram.org/bot${TOKEN}/setWebhook" \
            --data-urlencode "url=https://pace-api.nalinor.dev/telegram/webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode "allowed_updates=[\"message\",\"callback_query\"]" \
            --data-urlencode "drop_pending_updates=false" \
            | grep -q '"ok":true'

      - name: Smoke test
        run: |
          curl --fail --silent "${API_URL}/api/health" >/dev/null
          curl --fail --silent https://pace.nalinor.dev/ | grep -q '<div id="root">'
