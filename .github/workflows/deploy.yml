name: Deploy

# Runs after the "CI" workflow succeeds on main (workflow_run), or by hand.
# workflow_run was chosen over `needs:` + reusable workflows because it keeps ci.yml a plain
# workflow (PR checks stay unchanged) and never deploys a commit whose CI failed. The trade-off:
# in a workflow_run event `github.sha`/`github.ref` point at the default branch head, so the
# checkout below pins the exact commit CI tested (`workflow_run.head_sha`).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not interleave (migrations, secrets, webhook): one at a time, never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CI: 1
  API_URL: https://pace-api.nalinor.dev
  # wrangler reads these from the environment, no wrangler-action needed.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Cloudflare (API worker, D1 migrations, web assets, Telegram webhook)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pace.nalinor.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup

      - name: Build web
        working-directory: apps/app
        env:
          EXPO_PUBLIC_API_URL: https://pace-api.nalinor.dev
          EXPO_PUBLIC_TELEGRAM_BOT: ${{ vars.TELEGRAM_BOT_USERNAME || 'PaceTaskTrackerBot' }}
        run: bun run build:web

      - name: Apply D1 migrations
        working-directory: apps/api
        run: bunx wrangler d1 migrations apply pace --remote

      - name: Deploy API worker
        working-directory: apps/api
        run: bunx wrangler deploy

      - name: Deploy web (static assets worker)
        working-directory: apps/app
        run: bun run deploy:web

      # The bot token as pasted into GitHub may carry a trailing newline or spaces; every later
      # step (Worker secret, webhook secret, Bot API URLs) uses this trimmed copy.
      - name: Normalize TELEGRAM_BOT_TOKEN
        env:
          RAW: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          echo "BOT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Worker secrets are pushed only when the GitHub secret is set, so a fork or a fresh
      # deployment without a bot token still deploys (login stays disabled until it is added).
      - name: Secret TELEGRAM_BOT_TOKEN
        working-directory: apps/api
        run: if [ -n "$BOT_TOKEN" ]; then printf '%s' "$BOT_TOKEN" | bunx wrangler secret put TELEGRAM_BOT_TOKEN; fi

      # The webhook secret is what Telegram echoes in X-Telegram-Bot-Api-Secret-Token. An
      # explicit TELEGRAM_WEBHOOK_SECRET wins; otherwise it is derived from the bot token
      # (SHA-256, hex), so one secret is enough and the value is stable across deploys.
      - name: Resolve TELEGRAM_WEBHOOK_SECRET
        env:
          EXPLICIT: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          EXPLICIT="$(printf '%s' "$EXPLICIT" | tr -d '[:space:]')"
          if [ -n "$EXPLICIT" ]; then SECRET="$EXPLICIT";
          elif [ -n "$BOT_TOKEN" ]; then SECRET="$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-64)";
          else SECRET=""; fi
          if [ -n "$SECRET" ]; then echo "::add-mask::$SECRET"; fi
          echo "WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Secret TELEGRAM_WEBHOOK_SECRET
        working-directory: apps/api
        run: if [ -n "$WEBHOOK_SECRET" ]; then printf '%s' "$WEBHOOK_SECRET" | bunx wrangler secret put TELEGRAM_WEBHOOK_SECRET; fi

      # The LLM endpoints, in priority order: LLM_BASE_URL_N, LLM_API_KEY_N and LLM_MODEL_N for
      # any N, each a GitHub secret or variable (keys belong in secrets). A slot may list several
      # models and keys, comma separated; slot 1 is asked first. This step only runs jq over all
      # secrets and keeps the LLM_*_N ones in a file, so no other tool sees the rest.
      - name: Collect LLM endpoints
        env:
          GITHUB_SECRETS: ${{ toJSON(secrets) }}
          GITHUB_VARS: ${{ toJSON(vars) }}
        run: |
          jq -n --argjson s "$GITHUB_SECRETS" --argjson v "$GITHUB_VARS" \
            '($v + $s) | with_entries(select(.key | test("^LLM_(BASE_URL|API_KEY|MODEL)_(0|[1-9][0-9]*)$"))
               | .value |= gsub("^\\s+|\\s+$"; "")) | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/llm.json"
          # A trimmed secret is a new string: mask it like the secret it came from.
          jq -r --argjson s "$GITHUB_SECRETS" 'to_entries[] | select(.key | in($s)) | .value' "$RUNNER_TEMP/llm.json" \
            | while IFS= read -r value; do echo "::add-mask::$value"; done

      # Every LLM_*_N found is pushed to the Worker; numbered slots GitHub no longer has and the
      # names the Worker no longer reads (unnumbered LLM_*, GROQ_API_KEY, GEMINI_API_KEY) are
      # removed. With none in GitHub nothing is touched (endpoints set with `wrangler secret put`
      # stay), and a Worker left without any slot gets a warning: its assistant reads by rules.
      - name: Secrets LLM endpoints
        working-directory: apps/api
        run: |
          WANTED="$(cat "$RUNNER_TEMP/llm.json")"
          rm -f "$RUNNER_TEMP/llm.json"
          SLOT='^LLM_(BASE_URL|API_KEY|MODEL)_(0|[1-9][0-9]*)$'
          # Every slot needs all three names, or the Worker would refuse its config.
          INCOMPLETE="$(jq -r '[keys[] | capture("_(?<n>[0-9]+)$").n] | unique[] as $n
            | select([("LLM_BASE_URL_" + $n), ("LLM_API_KEY_" + $n), ("LLM_MODEL_" + $n)]
                     | map(in($w)) | all | not) | $n' --argjson w "$WANTED" <<<"$WANTED")"
          if [ -n "$INCOMPLETE" ]; then
            echo "::error::Set LLM_BASE_URL_N, LLM_API_KEY_N and LLM_MODEL_N together (slot ${INCOMPLETE//$'\n'/, })"
            exit 1
          fi
          CURRENT="$(bunx wrangler secret list --format json | jq '[.[].name]')"
          if [ "$(jq 'length' <<<"$WANTED")" -eq 0 ]; then
            if [ "$(jq --arg re "$SLOT" '[.[] | select(test($re))] | length' <<<"$CURRENT")" -eq 0 ]; then
              echo "::warning::No LLM_*_N in GitHub or on the Worker: the assistant reads by rules only"
            else
              echo "No LLM_*_N in GitHub: the Worker keeps the LLM endpoints it has"
            fi
            exit 0
          fi
          echo "LLM slots from GitHub: $(jq -r '[keys[] | capture("_(?<n>[0-9]+)$").n | tonumber] | unique | map(tostring) | join(", ")' <<<"$WANTED")"
          LEGACY='["LLM_API_KEY","LLM_BASE_URL","LLM_MODEL","GROQ_API_KEY","GEMINI_API_KEY"]'
          DROP="$(jq --arg re "$SLOT" --argjson w "$WANTED" --argjson legacy "$LEGACY" \
            '[.[] | . as $n | select((test($re) and ($w | has($n) | not)) or ($legacy | index($n)))]' <<<"$CURRENT")"
          jq -n --argjson w "$WANTED" --argjson drop "$DROP" '$w + ($drop | map({(.): null}) | add // {})' \
            | bunx wrangler secret bulk

      # The Firebase service account's JSON key: the Worker sends pushes through FCM with it.
      # Without it push is off (the phones poll) and everything else works.
      - name: Secret FIREBASE_SERVICE_ACCOUNT
        working-directory: apps/api
        env:
          VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$VALUE" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT: push is off, phones poll"
            exit 0
          fi
          # An unreadable key would leave push off without a word; fail here (never print it).
          if ! printf '%s' "$VALUE" | jq -e '.project_id and .client_email and .private_key' >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a service account JSON key"
            exit 1
          fi
          printf '%s' "$VALUE" | bunx wrangler secret put FIREBASE_SERVICE_ACCOUNT

      # BOT_INFO is the JSON of getMe, stored at deploy time so the bot never calls Telegram
      # on a cold start. Stored as a secret (same mechanism, not committed to wrangler.jsonc).
      - name: Store BOT_INFO (getMe)
        working-directory: apps/api
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN not set, skipping getMe"; exit 0; fi
          BOT_INFO="$(curl --fail --silent --show-error "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | jq -c '.result')"
          test -n "$BOT_INFO"
          echo "$BOT_INFO" | bunx wrangler secret put BOT_INFO

      - name: Set Telegram webhook
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN not set, skipping setWebhook"; exit 0; fi
          curl --fail --silent --show-error --request POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://pace-api.nalinor.dev/telegram/webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode "allowed_updates=[\"message\",\"callback_query\"]" \
            --data-urlencode "drop_pending_updates=false" \
            | grep -q '"ok":true'

      - name: Smoke test
        run: |
          curl --fail --silent "${API_URL}/api/health" >/dev/null
          curl --fail --silent https://pace.nalinor.dev/ | grep -q '<div id="root">'
          curl --fail --silent --head https://pace.nalinor.dev/sw.js >/dev/null
