name: Release

# Push a tag vX.Y.Z, or run it by hand on a branch with the tag to create: gate on the fast
# checks, build the Android release APK (arm64-v8a) and publish a GitHub Release with it (the
# release step creates the tag on the commit when it does not exist yet). app.config.ts derives
# version/versionCode from PACE_RELEASE_TAG.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on this commit, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CI: 1
  # The tag being released: the pushed one, or the one asked for by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Checks (lint, unit, api, app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tag must look like vX.Y.Z
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun lint
      - name: Lint must not change files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi
      - run: bun test:unit
      - run: bun test:api
      - run: bun test:app

  apk:
    name: Android release APK + GitHub Release
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_GIT_STATUS: 1
      EXPO_NO_TELEMETRY: 1
      PACE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK + CMake (the runner image already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # Firebase for push (FCM): the raw google-services.json from the secret, read by
      # app.config.ts through GOOGLE_SERVICES_FILE. Without it the APK builds with push off.
      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON: building without push"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/app/google-services.json
          echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"

      - name: Expo prebuild (continuous native generation, android/ is gitignored)
        working-directory: apps/app
        run: bun expo prebuild --platform android --no-install

      # Without ANDROID_KEYSTORE_BASE64 the config plugin (plugins/with-release-signing.js)
      # falls back to the committed debug keystore, so every build installs over the previous one.
      - name: Release keystore (only when the secret is set)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64: signing with the committed debug keystore"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/app/android/app/release.keystore
          {
            echo "ORG_GRADLE_PROJECT_PACE_STORE_FILE=release.keystore"
            echo "ORG_GRADLE_PROJECT_PACE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_PACE_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_PACE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signing=release" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: apps/app/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: |
          mkdir -p release
          cp apps/app/android/app/build/outputs/apk/release/app-release.apk "release/pace-${{ env.TAG }}.apk"
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: pace-${{ env.TAG }}-apk
          path: release/pace-${{ env.TAG }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release body
        env:
          SIGNING: ${{ steps.keystore.outputs.signing }}
        run: |
          {
            echo "Android APK: \`pace-${{ env.TAG }}.apk\` (arm64-v8a)."
            echo
            if [ "$SIGNING" = "debug" ]; then
              echo "> **debug-signed**: built with the committed debug keystore (no release keystore secret configured)."
            else
              echo "Signed with the release keystore."
            fi
          } > release/notes.md

      - uses: softprops/action-gh-release@v3
        id: release
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Pace ${{ env.TAG }}
          generate_release_notes: true
          body_path: release/notes.md
          files: release/pace-${{ env.TAG }}.apk
          fail_on_unmatched_files: true

      # The bot sends the APK to the owner's private chat; set the repository variable
      # TELEGRAM_RELEASE_CHAT_ID (the owner's Telegram user id, who must have opened the bot
      # once) to turn it on. The Bot API accepts files up to 50 MB, so fail loudly beyond it.
      # The token and the other values go through env:, never into the command text.
      - name: Send the APK to Telegram
        if: ${{ vars.TELEGRAM_RELEASE_CHAT_ID != '' }}
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_RELEASE_CHAT_ID }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          TELEGRAM_BOT_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_RELEASE_CHAT_ID is set but the TELEGRAM_BOT_TOKEN secret is empty"
            exit 1
          fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          APK="release/pace-${TAG}.apk"
          SIZE="$(stat -c %s "$APK")"
          LIMIT=$((50 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "The APK is $SIZE bytes, over the 50 MB (52428800 bytes) a bot may send: not sending it to Telegram"
            exit 1
          fi
          curl -sS --fail-with-body \
            -F chat_id="$CHAT_ID" \
            -F document=@"$APK" \
            -F caption="Pace ${TAG} — ${RELEASE_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
