name: LLM regression

# Runs one real read through every configured LLM endpoint (apps/api/scripts/llm-smoke.ts) until
# the full parsing regression runner exists, which will publish a refreshed docs/llm.md.
# On demand: it costs API calls and minutes.
on:
  # On demand only: a weekly schedule cost more minutes than the private repo can spare.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm:
    name: Parse regression (configured models)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # LLM_BASE_URL_N / LLM_API_KEY_N / LLM_MODEL_N for N = 1..5, as in deploy.yml (spelled out:
      # `toJSON(secrets)` makes GitHub hold the run for approval).
      - name: LLM endpoints
        env:
          LLM_BASE_URL_1: ${{ secrets.LLM_BASE_URL_1 || vars.LLM_BASE_URL_1 }}
          LLM_API_KEY_1: ${{ secrets.LLM_API_KEY_1 || vars.LLM_API_KEY_1 }}
          LLM_MODEL_1: ${{ secrets.LLM_MODEL_1 || vars.LLM_MODEL_1 }}
          LLM_BASE_URL_2: ${{ secrets.LLM_BASE_URL_2 || vars.LLM_BASE_URL_2 }}
          LLM_API_KEY_2: ${{ secrets.LLM_API_KEY_2 || vars.LLM_API_KEY_2 }}
          LLM_MODEL_2: ${{ secrets.LLM_MODEL_2 || vars.LLM_MODEL_2 }}
          LLM_BASE_URL_3: ${{ secrets.LLM_BASE_URL_3 || vars.LLM_BASE_URL_3 }}
          LLM_API_KEY_3: ${{ secrets.LLM_API_KEY_3 || vars.LLM_API_KEY_3 }}
          LLM_MODEL_3: ${{ secrets.LLM_MODEL_3 || vars.LLM_MODEL_3 }}
          LLM_BASE_URL_4: ${{ secrets.LLM_BASE_URL_4 || vars.LLM_BASE_URL_4 }}
          LLM_API_KEY_4: ${{ secrets.LLM_API_KEY_4 || vars.LLM_API_KEY_4 }}
          LLM_MODEL_4: ${{ secrets.LLM_MODEL_4 || vars.LLM_MODEL_4 }}
          LLM_BASE_URL_5: ${{ secrets.LLM_BASE_URL_5 || vars.LLM_BASE_URL_5 }}
          LLM_API_KEY_5: ${{ secrets.LLM_API_KEY_5 || vars.LLM_API_KEY_5 }}
          LLM_MODEL_5: ${{ secrets.LLM_MODEL_5 || vars.LLM_MODEL_5 }}
        run: |
          jq -nr 'env | to_entries[] | select(.key | test("^LLM_(BASE_URL|API_KEY|MODEL)_[0-9]+$"))
             | select(.value != "") | "\(.key)=\(.value | gsub("[\\r\\n]+"; ","))"' > "$RUNNER_TEMP/llm.env"
          # A key list joined from several lines is a new string: mask it like the secret.
          while IFS='=' read -r _ value; do echo "::add-mask::$value"; done < "$RUNNER_TEMP/llm.env"
          cat "$RUNNER_TEMP/llm.env" >> "$GITHUB_ENV"
      - run: bun test:llm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llm-regression-report
          path: docs/llm.md
          if-no-files-found: warn
          retention-days: 90
