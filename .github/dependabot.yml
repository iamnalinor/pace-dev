version: 2
updates:
  # Every dependabot PR costs a CI run: monthly, few at a time, minor/patch bumps in one PR.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Expo SDK packages must move together (expo, react-native, expo-* modules).
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "@expo-google-fonts/*", "babel-preset-expo", "jest-expo", "react-native", "react-native-*", "@react-native/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      lint:
        patterns: ["eslint*", "@eslint*", "typescript-eslint", "@typescript-eslint/*", "@biomejs/*", "knip", "jscpd", "dependency-cruiser"]
      test:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "@axe-core/*", "fast-check", "@stryker-mutator/*", "jest", "@types/jest", "test-renderer"]
      # Whatever the groups above leave: all its minor and patch bumps together.
      everything-else:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK majors move together and need `expo install --fix`; done by hand once stable.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # jest-expo pins the Jest major (jest-expo 57 is built on Jest 29).
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # The types follow the Node major the tooling runs on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Gradle (apps/app/android) is generated by `expo prebuild` and gitignored: nothing to track.
